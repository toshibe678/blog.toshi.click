services:
  blog:
    container_name: blog
    #    image: ghcr.io/toshibe678/blog.toshi.click/blog:latest
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: ./.env
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      NODE_ENV: development
    ports:
      - "4321:4321"
    stdin_open: true
    tty: true
